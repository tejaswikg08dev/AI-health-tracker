# ============================================================================
# Health Tracker — Nginx Reverse Proxy Configuration
# ============================================================================
# WHAT NGINX DOES IN THIS PROJECT:
#   1. Reverse Proxy: Routes /api/* requests to FastAPI backend
#   2. Static Files: Serves React frontend build (in production)
#   3. Rate Limiting: First line of defense against abuse
#   4. Security Headers: Prevents XSS, clickjacking, MIME sniffing
#   5. Gzip: Compresses responses for faster page loads
#   6. SSE Support: Allows streaming for AI chat responses
#
# HOW NGINX WORKS (Interview Gold):
#   Nginx uses an EVENT-DRIVEN, NON-BLOCKING architecture.
#   One master process + multiple worker processes.
#   Each worker handles THOUSANDS of connections using epoll (Linux) / kqueue (Mac).
#   It does NOT create a thread per connection (like Apache).
#   This is why Nginx handles 10K+ concurrent connections with minimal RAM.
#
# REQUEST FLOW:
#   Browser → Nginx (:80) → FastAPI (:8000)
#                          → Static files (React build)
#
# IN PRODUCTION (AWS):
#   Browser → CloudFront (CDN) → ALB → Nginx (sidecar in ECS) → FastAPI
# ============================================================================

# ── Upstream Backend ──
# Defines the backend server(s). In production, you'd list multiple servers
# for load balancing. Nginx distributes requests across them.
upstream backend {
    # Docker Compose service name resolves to the container's IP
    server backend:8000;

    # Load balancing examples (uncomment for multiple backends):
    # server backend-1:8000;
    # server backend-2:8000;
    # server backend-3:8000;

    # Keep connections alive between Nginx and backend (connection pooling)
    # Without this, Nginx opens a new TCP connection for EVERY request (slow).
    keepalive 32;
}

# ── Rate Limiting Zones ──
# Define rate limit buckets BEFORE the server block.
# $binary_remote_addr = client IP address (binary format, saves memory)
# zone=name:size = shared memory zone (10 MB stores ~160K IP addresses)
# rate=10r/s = allow 10 requests per second per IP

# General API rate limit: 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# AI endpoints: stricter limit (2 requests/second — LLM calls are expensive)
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=2r/s;

# Login: strict limit to prevent brute force (5 requests/minute per IP)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;


# ── Server Block ──
server {
    listen 80;
    server_name localhost;

    # ── Security Headers ──
    # These prevent common web attacks. Every production app needs them.

    # Prevent clickjacking: don't allow this site to be embedded in an iframe
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing: browser must trust the Content-Type we send
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS filter in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Control what info is sent in the Referrer header
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──
    # Compresses responses before sending to the client.
    # A 100KB JSON response becomes ~15KB compressed.
    # Saves bandwidth and makes the app feel faster.
    gzip on;
    gzip_vary on;                          # Tell proxies to cache gzipped + ungzipped versions
    gzip_proxied any;                      # Compress responses from proxied requests too
    gzip_comp_level 6;                     # Compression level (1=fast/less, 9=slow/more, 6=balanced)
    gzip_min_length 1000;                  # Don't compress tiny responses (overhead > savings)
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── API Routes → Backend ──
    # All /api/* requests are forwarded to the FastAPI backend.
    location /api/ {
        # Apply general rate limit: allow bursts of 20 over the 30r/s limit
        # 'burst' = queue up to 20 excess requests instead of rejecting immediately
        # 'nodelay' = process burst requests immediately, don't delay them
        limit_req zone=api_limit burst=20 nodelay;

        # Forward request to the upstream backend
        proxy_pass http://backend;

        # ── Proxy Headers ──
        # These tell FastAPI about the REAL client (not Nginx).
        # Without these, FastAPI thinks every request comes from Nginx's IP.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request tracing: pass a unique ID through the proxy chain
        proxy_set_header X-Request-ID $request_id;

        # ── Timeouts ──
        proxy_connect_timeout 5s;          # Max time to establish connection to backend
        proxy_read_timeout 60s;            # Max time to wait for backend response
        proxy_send_timeout 60s;            # Max time to send request to backend

        # Use HTTP/1.1 for keepalive connections to backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── AI Endpoints → Backend (Stricter Rate Limit + SSE Support) ──
    location /api/v1/ai/ {
        # Stricter rate limit for AI (expensive LLM calls)
        limit_req zone=ai_limit burst=5 nodelay;

        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE (Server-Sent Events) Support ──
        # AI chat streams responses word-by-word using SSE.
        # These settings are CRITICAL for streaming to work:
        proxy_buffering off;               # Don't buffer — send data to client immediately
        proxy_cache off;                   # Don't cache streaming responses
        proxy_read_timeout 300s;           # AI responses can take up to 5 minutes
        chunked_transfer_encoding on;      # Allow chunked responses

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Login Endpoint → Backend (Anti-Brute-Force Rate Limit) ──
    location /api/v1/auth/login {
        # Very strict: 5 requests per minute per IP
        # Prevents password brute-forcing
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Health Check ──
    # Used by load balancers (ALB) and Docker health checks.
    # access_log off prevents health checks from flooding logs.
    location /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    # ── Frontend Static Files (Production) ──
    # In production, Nginx serves the React build directly.
    # React's index.html is returned for ALL non-API routes (SPA routing).
    # In development, you access React's dev server directly (port 5173).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (JS, CSS, images)
        # These files have content hashes in their names (app.a1b2c3.js),
        # so a new build = new filename = automatic cache bust.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Swagger/API Docs ──
    # Proxy documentation endpoints to backend
    location /docs {
        proxy_pass http://backend/docs;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://backend/redoc;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend/openapi.json;
        proxy_set_header Host $host;
    }

    # ── Custom Error Pages ──
    # Return JSON errors instead of Nginx's default HTML pages.
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error_code": "RATE_LIMIT_EXCEEDED", "message": "Too many requests. Please slow down.", "detail": null}';
    }

    error_page 502 @bad_gateway;
    location @bad_gateway {
        default_type application/json;
        return 502 '{"error_code": "SERVICE_UNAVAILABLE", "message": "Backend service is starting up. Please try again in a moment.", "detail": null}';
    }

    error_page 504 @gateway_timeout;
    location @gateway_timeout {
        default_type application/json;
        return 504 '{"error_code": "GATEWAY_TIMEOUT", "message": "Request timed out. Please try again.", "detail": null}';
    }
}
