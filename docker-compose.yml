# ============================================================================
# Health Tracker — Docker Compose (Production-like)
# ============================================================================
# Usage:
#   docker-compose up -d          → Start all services
#   docker-compose down           → Stop all services
#   docker-compose logs -f        → Follow logs
#   docker-compose ps             → Check status
#
# For development with hot reload, use the dev override:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================================

services:
  # ── Reverse Proxy ──
  # Nginx sits in front of everything — routes requests, rate limits, serves static files
  nginx:
    image: nginx:1.25-alpine
    container_name: ht-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend API ──
  # FastAPI application — handles all API requests
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ht-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DB/Redis URLs to use Docker service names instead of localhost
      - DATABASE_URL=postgresql+asyncpg://healthuser:healthpass@postgres:5432/healthtracker
      - DATABASE_URL_SYNC=postgresql://healthuser:healthpass@postgres:5432/healthtracker
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Celery Worker ──
  # Processes background tasks: email sending, report generation, etc.
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ht-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://healthuser:healthpass@postgres:5432/healthtracker
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat ──
  # Scheduler: triggers periodic tasks (daily reminders, weekly reports)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ht-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://healthuser:healthpass@postgres:5432/healthtracker
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL + pgvector ──
  # Primary database: users, habits, logs, analytics, AI documents + embeddings
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ht-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: healthtracker
      POSTGRES_USER: healthuser
      POSTGRES_PASSWORD: healthpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthuser -d healthtracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ──
  # Cache + Celery broker + rate limiting + token blacklist
  redis:
    image: redis:7-alpine
    container_name: ht-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible storage) ──
  # Local replacement for AWS S3 — stores PDFs, CSVs, reports
  minio:
    image: minio/minio
    container_name: ht-minio
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Ollama (Local LLM) ──
  # Runs Llama 3.1 and nomic-embed-text locally — 100% free AI
  ollama:
    image: ollama/ollama
    container_name: ht-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
    name: ht-postgres-data
  redis_data:
    name: ht-redis-data
  minio_data:
    name: ht-minio-data
  ollama_data:
    name: ht-ollama-data
